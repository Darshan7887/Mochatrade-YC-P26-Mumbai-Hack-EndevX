<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar with Video Previews</title>
  <style>
    body {
      margin: 0;
      font-family: "Fugaz one", sans-serif;
      background: #f6f6f9;
    }

    /* Background video */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Navbar */
    .navbar {
      background: rgba(75, 42, 173, 0.9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      color: #fff;
      position: relative;
      z-index: 10;
    }

    /* Logo */
    .navbar .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .navbar .logo img {
      width: 80px;
      height: 55px;
      border-radius: 6px;
    }
    .navbar .logo span {
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* Menu */
    .navbar .menu {
      display: flex;
      gap: 25px;
      position: relative;
    }
    .navbar .menu a {
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 5px 8px;
      position: relative;
      transition: all 0.3s ease;
    }

    .navbar .menu a:hover {
      color: #ffcc00;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      filter: none !important;
    }

    /* Blur other options */
    .navbar .menu:hover a:not(:hover) {
      filter: blur(2px) brightness(70%);
    }

    /* Right side */
    .navbar .right {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .reward {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.9rem;
    }
    .reward img {
      width: 20px;
      height: 20px;
    }
    .profile img {
      width: 70px;
      height: 55px;
      border-radius: 50%;
      border: 0px solid #fff;
    }

    /* Content */
    .content {
      padding: 40px;
      position: relative;
      z-index: 1;
      color: #fff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6);
      transition: filter 0.3s ease;
    }
    .menu:hover ~ .content {
      filter: blur(5px);
    }

    /* Video preview */
    .video-preview {
      position: absolute;
      top: 40px;
      left: 0;
      width: 200px;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      background: #000;
      z-index: 20;
    }
    .video-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .navbar .menu a:hover .video-preview {
      opacity: 1;
    }
    /* Air Writing Layout */
.main-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  margin-top: 40px;
}

.camera-box, .trace-box {
  position: relative;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

#inputVideo {
  width: 400px;
  height: 300px;
  border-radius: 10px;
  object-fit: cover;
  transform: scaleX(1); /* non-mirrored */
}

#cameraCanvas {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 400px;
  height: 300px;
  pointer-events: none;
}

#traceCanvas {
  width: 400px;
  height: 300px;
  border-radius: 10px;
  background: #000;
}

  </style>

</head>
<body>

  <!-- Background video -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="assets/videos/pix.mp4" type="video/mp4" />
  </video>

  <!-- Navbar -->
  <div class="navbar">
    <a href="front.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px;" title="Go Home">
      <div class="logo">
        <img src="assets/images/Screenshot 2025-09-14 134929.png" alt="Logo">
        <span>BrainBerry</span>
      </div>
    </a>

    <div class="menu">
      <a href="index.html">
        Home
        <div class="video-preview">
          <video autoplay muted loop playsinline>
            <source src="assets/videos/pix.mp4" type="video/mp4">
          </video>
        </div>
      </a>
      <a href="chal.html">
        Challenges
        <div class="video-preview">
          <video autoplay muted loop playsinline>
            <source src="assets/videos/pix12.mp4" type="video/mp4">
          </video>
        </div>
      </a>
      <a href="#">
        Games
        <div class="video-preview">
          <video autoplay muted loop playsinline>
            <source src="assets/videos/pix3.mp4" type="video/mp4">
          </video>
        </div>
      </a>
      <a href="#">
        Lessons
        <div class="video-preview">
          <video autoplay muted loop playsinline>
            <source src="assets/videos/pix5.mov" type="video/mp4">
          </video>
        </div>
      </a>
      <a href="#">
        Rewards
        <div class="video-preview">
          <video autoplay muted loop playsinline>
            <source src="assets/videos/reward.mp4" type="video/mp4">
          </video>
        </div>
      </a>
      <a href="help.html">
        Help
        <div class="video-preview">
          <video autoplay muted loop playsinline>
            <source src="assets/videos/help.mp4" type="video/mp4">
          </video>
        </div>
      </a>
    </div>

    <div class="right">
      <div class="reward">
        <img src="https://cdn-icons-png.flaticon.com/512/616/616490.png" alt="Gem">
        <span>0</span>
      </div>
      <div class="reward">
        <img src="https://cdn-icons-png.flaticon.com/512/138/138281.png" alt="Coin">
        <span>0</span>
      </div>
      <div class="profile">
        <img src="assets/images/dp-cactus-20.png" alt="User">
      </div>
    </div>
  </div>
  <!-- Air Writing Section -->
  <div class="main-area">
    <!-- Left: Live Camera -->
    <div class="camera-box">
      <video id="inputVideo" autoplay playsinline></video>
      <canvas id="cameraCanvas"></canvas>
    </div>

    <!-- Right: Finger Tracing -->
    <div class="trace-box">
      <canvas id="traceCanvas"></canvas>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>
  <script src="assets/js/airwriting-opencv.js"></script>


</body>

</html>
